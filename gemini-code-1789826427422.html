<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magallanes Pharmacy — POS &amp; Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Libre+Franklin:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- PDF Library for Exact 57mm Generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* ============================================================
   MAGALLANES PHARMACY — design tokens
   ============================================================ */
:root{
  --leaf:#1B6B4A; --leaf-deep:#0E4530; --leaf-dim:#2E8763; --leaf-wash:#E7F1EB;
  --ink:#12211C; --ink-2:#3E514A; --ink-3:#6C7D77;
  --sheet:#F4F6F3; --card:#FFFFFF; --rule:#DCE3DE; --rule-2:#EBEFEC;
  --amber:#9A6206; --amber-wash:#FBF0DC;
  --alert:#A32C2C; --alert-wash:#F8E6E4;
  --rx:#38518F; --rx-wash:#E7EBF6;
  --ok:#1B6B4A; --ok-wash:#E7F1EB;
  --shadow:0 1px 2px rgba(18,33,28,.06), 0 6px 18px -10px rgba(18,33,28,.22);
  --r:6px; --r-lg:10px;
  --side-w:230px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --leaf:#4FA47C; --leaf-deep:#0C1A15; --leaf-dim:#6FBE99; --leaf-wash:#173026;
    --ink:#E6EDE9; --ink-2:#AFC0B8; --ink-3:#7F918A;
    --sheet:#0F1714; --card:#161F1B; --rule:#2A3630; --rule-2:#202B26;
    --amber:#E0A544; --amber-wash:#2E2414;
    --alert:#E88178; --alert-wash:#331A18;
    --rx:#8EA5DE; --rx-wash:#1B2237;
    --ok:#4FA47C; --ok-wash:#173026;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --leaf:#4FA47C; --leaf-deep:#0C1A15; --leaf-dim:#6FBE99; --leaf-wash:#173026;
  --ink:#E6EDE9; --ink-2:#AFC0B8; --ink-3:#7F918A;
  --sheet:#0F1714; --card:#161F1B; --rule:#2A3630; --rule-2:#202B26;
  --amber:#E0A544; --amber-wash:#2E2414;
  --alert:#E88178; --alert-wash:#331A18;
  --rx:#8EA5DE; --rx-wash:#1B2237;
  --ok:#4FA47C; --ok-wash:#173026;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--sheet); color:var(--ink);
  font-family:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.num,input[type=number],td.num,th.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.012em; line-height:1.2}
h1{font-size:23px} h2{font-size:18px} h3{font-size:15px} h4{font-size:13px}
a{color:var(--leaf)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--leaf-dim); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important; transition-duration:.001ms!important}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule); border-radius:6px; border:2px solid var(--sheet)}

/* ---------- login ---------- */
#login{position:fixed; inset:0; display:grid; place-items:center; background:var(--sheet); z-index:60; padding:24px}
.login-card{width:min(380px,100%); background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden}
.login-head{background:var(--leaf-deep); color:#fff; padding:26px 26px 22px}
.login-head .mark{display:flex; align-items:center; gap:10px}
.login-head h1{font-size:19px; color:#fff}
.login-head p{margin:4px 0 0; font-size:12.5px; color:#A9CBBA}
.login-body{padding:22px 26px 26px}
.login-hint{margin-top:16px; padding-top:14px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink-3)}
.login-hint code{background:var(--rule-2); padding:1px 5px; border-radius:4px; color:var(--ink-2)}

/* ---------- app shell ---------- */
#app{display:none; min-height:100%}
#app.on{display:block}
.side{position:fixed; inset:0 auto 0 0; width:var(--side-w); background:var(--leaf-deep); color:#CFE3D8; display:flex; flex-direction:column; z-index:20}
.side .brand{padding:18px 16px 14px; border-bottom:1px solid rgba(255,255,255,.09)}
.side .brand .nm{color:#fff; font-weight:700; font-size:14.5px; letter-spacing:-.01em; line-height:1.25}
.side .brand .tag{font-size:11px; color:#8FB6A2; margin-top:3px}
.side nav{flex:1; overflow-y:auto; padding:10px 8px}
.side nav button{
  width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; margin-bottom:2px;
  background:none; border:0; border-radius:var(--r); color:#CFE3D8; font-size:13.5px; cursor:pointer; text-align:left;
}
.side nav button .ic{width:18px; text-align:center; font-size:14px; opacity:.9}
.side nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.side nav button.sel{background:var(--leaf); color:#fff; font-weight:500}
.side nav .grp{font-size:10.5px; color:#6E9682; padding:12px 10px 5px; letter-spacing:.06em}
.side .who{padding:12px 14px; border-top:1px solid rgba(255,255,255,.09); font-size:12px}
.side .who .n{color:#fff; font-weight:500}
.side .who .r{color:#8FB6A2}
.side .who .out{margin-top:8px; display:flex; gap:6px}
.side .who .out button{flex:1; background:rgba(255,255,255,.08); border:0; color:#CFE3D8; padding:6px; border-radius:var(--r); font-size:12px; cursor:pointer}
.side .who .out button:hover{background:rgba(255,255,255,.16); color:#fff}

.main{margin-left:var(--side-w); min-height:100vh; display:flex; flex-direction:column}
.top{position:sticky; top:0; z-index:15; background:var(--card); border-bottom:1px solid var(--rule); padding:0 22px; height:54px; display:flex; align-items:center; gap:14px}
.top .ttl{font-size:15.5px; font-weight:600}
.top .sub{font-size:12.5px; color:var(--ink-3)}
.top .sp{flex:1}
.top .clock{font-size:12.5px; color:var(--ink-3)}
.view{padding:20px 22px 40px; flex:1}
.view[hidden]{display:none}

/* ---------- primitives ---------- */
.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg)}
.card>.hd{padding:13px 16px; border-bottom:1px solid var(--rule-2); display:flex; align-items:center; gap:10px}
.card>.hd h3{flex:1}
.card>.bd{padding:16px}
.row{display:flex; gap:10px; align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid; gap:14px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 13px; border-radius:var(--r); border:1px solid var(--rule);
  background:var(--card); color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--rule-2)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.pri{background:var(--leaf); border-color:var(--leaf); color:#fff}
.btn.pri:hover{background:var(--leaf-dim); border-color:var(--leaf-dim)}
.btn.danger{color:var(--alert); border-color:var(--alert)}
.btn.danger:hover{background:var(--alert-wash)}
.btn.sm{padding:5px 9px; font-size:12.5px}
.btn.lg{padding:13px 18px; font-size:15px}
.btn.block{width:100%}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--rule-2)}

label.f{display:block; margin-bottom:11px}
label.f>span{display:block; font-size:12px; color:var(--ink-2); margin-bottom:4px; font-weight:500}
.inp{
  width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:var(--r);
  background:var(--card); color:var(--ink); font-size:13.5px;
}
.inp:focus{outline:none; border-color:var(--leaf); box-shadow:0 0 0 3px var(--leaf-wash)}
textarea.inp{min-height:64px; resize:vertical}
.inp.err{border-color:var(--alert)}
.errmsg{color:var(--alert); font-size:11.5px; margin-top:3px}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.fgrid.c3{grid-template-columns:1fr 1fr 1fr}
.fgrid .full{grid-column:1/-1}

.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:500; white-space:nowrap}
.chip.ok{background:var(--ok-wash); color:var(--ok)}
.chip.warn{background:var(--amber-wash); color:var(--amber)}
.chip.bad{background:var(--alert-wash); color:var(--alert)}
.chip.rx{background:var(--rx-wash); color:var(--rx)}
.chip.neutral{background:var(--rule-2); color:var(--ink-2)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}

.stat{background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg); padding:14px 16px}
.stat .k{font-size:12px; color:var(--ink-3)}
.stat .v{font-size:25px; font-weight:700; letter-spacing:-.02em; margin-top:3px; line-height:1.1}
.stat .d{font-size:11.5px; color:var(--ink-3); margin-top:3px}
.stat.hi{border-left:3px solid var(--leaf)}
.stat.warn{border-left:3px solid var(--amber)}
.stat.bad{border-left:3px solid var(--alert)}

table.tbl{width:100%; border-collapse:collapse; font-size:13px}
table.tbl th{
  text-align:left; font-weight:600; font-size:11.5px; color:var(--ink-3);
  padding:9px 10px; border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--card); z-index:1;
}
table.tbl th.num,table.tbl td.num{text-align:right}
table.tbl td{padding:9px 10px; border-bottom:1px solid var(--rule-2); vertical-align:middle}
table.tbl tbody tr:hover{background:var(--rule-2)}
table.tbl tbody tr.clickable{cursor:pointer}
.tbl-wrap{overflow-x:auto; max-height:none}
.empty{padding:38px 20px; text-align:center; color:var(--ink-3)}
.empty .big{font-size:15px; color:var(--ink-2); margin-bottom:5px; font-weight:500}
.pager{display:flex; align-items:center; gap:8px; padding:11px 16px; border-top:1px solid var(--rule-2); font-size:12.5px; color:var(--ink-3)}

.modal-bg{position:fixed; inset:0; background:rgba(12,22,18,.5); display:grid; place-items:center; z-index:50; padding:20px}
.modal{background:var(--card); border-radius:var(--r-lg); border:1px solid var(--rule); box-shadow:var(--shadow); width:min(760px,100%); max-height:calc(100vh - 40px); display:flex; flex-direction:column}
.modal.wide{width:min(1000px,100%)}
.modal.narrow{width:min(440px,100%)}
.modal .mh{padding:15px 18px; border-bottom:1px solid var(--rule-2); display:flex; align-items:center; gap:10px}
.modal .mh h3{flex:1}
.modal .mb{padding:18px; overflow-y:auto}
.modal .mf{padding:13px 18px; border-top:1px solid var(--rule-2); display:flex; gap:9px; justify-content:flex-end}
.x{background:none; border:0; color:var(--ink-3); font-size:19px; cursor:pointer; line-height:1; padding:2px 6px; border-radius:4px}
.x:hover{background:var(--rule-2); color:var(--ink)}

#toasts{position:fixed; right:18px; bottom:18px; z-index:70; display:flex; flex-direction:column; gap:8px; align-items:flex-end}
.toast{background:var(--ink); color:var(--sheet); padding:10px 14px; border-radius:var(--r); font-size:13px; box-shadow:var(--shadow); max-width:340px; animation:tin .16s ease-out}
.toast.bad{background:var(--alert); color:#fff}
.toast.warn{background:var(--amber); color:#fff}
@keyframes tin{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

.banner{padding:10px 14px; border-radius:var(--r); font-size:13px; display:flex; gap:9px; align-items:flex-start}
.banner.warn{background:var(--amber-wash); color:var(--amber)}
.banner.bad{background:var(--alert-wash); color:var(--alert)}
.banner.info{background:var(--leaf-wash); color:var(--leaf)}
.demo-tag{font-size:10px; color:var(--ink-3); border:1px solid var(--rule); padding:0 4px; border-radius:3px; margin-left:5px; vertical-align:1px}
</style>
<style>
/* ---------- POS ---------- */
.pos{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}
.pos .find{position:relative}
.scan{display:flex; gap:10px; align-items:stretch; margin-bottom:12px}
.scan .barcode{
  flex:1; display:flex; align-items:center; gap:10px; background:var(--card);
  border:2px solid var(--leaf); border-radius:var(--r-lg); padding:0 14px;
}
.scan .barcode .lbl{font-size:11.5px; color:var(--leaf); font-weight:600; white-space:nowrap}
.scan .barcode input{flex:1; border:0; background:none; padding:13px 0; font-size:16px; letter-spacing:.02em}
.scan .barcode input:focus{outline:none}
.search-box{position:relative}
.search-box input{padding-left:32px; font-size:14.5px; padding-top:10px; padding-bottom:10px}
.search-box .mag{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.sugg{
  position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--card);
  border:1px solid var(--rule); border-radius:var(--r-lg); box-shadow:var(--shadow); z-index:12;
  max-height:340px; overflow-y:auto;
}
.sugg[hidden]{display:none}
.sugg .s-item{padding:9px 12px; display:flex; gap:12px; align-items:center; cursor:pointer; border-bottom:1px solid var(--rule-2)}
.sugg .s-item:last-child{border-bottom:0}
.sugg .s-item.on,.sugg .s-item:hover{background:var(--leaf-wash)}
.sugg .s-item .nm{font-weight:500}
.sugg .s-item .meta{font-size:11.5px; color:var(--ink-3)}
.prod-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(184px,1fr)); gap:10px}
.pcard{background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg); padding:11px 12px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:3px}
.pcard:hover{border-color:var(--leaf)}
.pcard:disabled{opacity:.5; cursor:not-allowed}
.pcard .nm{font-weight:600; font-size:13.5px; line-height:1.25}
.pcard .gn{font-size:11.5px; color:var(--ink-3)}
.pcard .bot{display:flex; align-items:baseline; gap:6px; margin-top:5px}
.pcard .pr{font-weight:700; font-size:15px}
.pcard .loc{font-size:11px; color:var(--ink-2); background:var(--rule-2); padding:1px 6px; border-radius:4px}

.cart{position:sticky; top:70px; background:var(--card); border:1px solid var(--rule); border-radius:var(--r-lg); display:flex; flex-direction:column; max-height:calc(100vh - 88px)}
.cart .ch{padding:12px 14px; border-bottom:1px solid var(--rule-2); display:flex; align-items:center; gap:8px}
.cart .ch h3{flex:1}
.cart .items{flex:1; overflow-y:auto; min-height:120px}
.citem{padding:10px 14px; border-bottom:1px solid var(--rule-2)}
.citem.flash{animation:cflash .5s ease-out}
@keyframes cflash{from{background:var(--leaf-wash)}to{background:transparent}}
.citem .l1{display:flex; gap:8px; align-items:flex-start}
.citem .nm{flex:1; font-weight:500; font-size:13px; line-height:1.3}
.citem .meta{font-size:11px; color:var(--ink-3); margin-top:1px}
.citem .l2{display:flex; align-items:center; gap:7px; margin-top:7px}
.qty{display:flex; align-items:center; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.qty button{width:26px; height:26px; border:0; background:var(--card); cursor:pointer; color:var(--ink-2); font-size:14px}
.qty button:hover{background:var(--rule-2)}
.qty input{width:44px; height:26px; border:0; border-left:1px solid var(--rule); border-right:1px solid var(--rule); text-align:center; background:var(--card); font-size:13px}
.qty input:focus{outline:none; background:var(--leaf-wash)}
.citem .amt{margin-left:auto; font-weight:600; font-size:13.5px}
.cart .totals{border-top:1px solid var(--rule); padding:12px 14px; background:var(--card)}
.trow{display:flex; justify-content:space-between; font-size:13px; padding:2px 0; color:var(--ink-2)}
.trow.grand{font-size:26px; font-weight:700; color:var(--ink); padding:8px 0 10px; letter-spacing:-.02em; border-top:1px solid var(--rule); margin-top:7px; align-items:baseline}
.trow.grand span:first-child{font-size:13px; font-weight:500; color:var(--ink-3)}
.keyhint{font-size:10.5px; color:var(--ink-3); border:1px solid var(--rule); border-radius:3px; padding:0 4px; margin-left:4px}

/* ---------- charts ---------- */
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart text{font-family:inherit; font-size:10.5px; fill:var(--ink-3)}
.chart .axis{stroke:var(--rule); stroke-width:1}
.chart .gl{stroke:var(--rule-2); stroke-width:1}
.chart .bar{fill:var(--leaf)}
.chart .bar.alt{fill:var(--leaf-dim)}
.chart .ln{fill:none; stroke:var(--leaf); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.chart .area{fill:var(--leaf-wash)}
.chart .pt{fill:var(--leaf)}
.chart .lbl{fill:var(--ink-2); font-size:10.5px}
.legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12px; color:var(--ink-2)}
.legend .sw{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:-1px}
.hbar{display:grid; grid-template-columns:minmax(120px,1.4fr) minmax(0,3fr) auto; gap:10px; align-items:center; padding:5px 0; font-size:12.5px}
.hbar .track{background:var(--rule-2); border-radius:3px; height:16px; overflow:hidden}
.hbar .fill{height:100%; background:var(--leaf); border-radius:3px}
.hbar .fill.alt{background:var(--amber)}

/* ---------- responsive ---------- */
@media (max-width:1080px){ .pos{grid-template-columns:minmax(0,1fr)} .cart{position:static; max-height:none} }
@media (max-width:820px){
  .side{position:static; width:auto; flex-direction:row; align-items:center; gap:10px; padding:0 10px; overflow-x:auto}
  .side .brand{border-bottom:0; padding:10px 8px; white-space:nowrap}
  .side .brand .tag{display:none}
  .side nav{display:flex; flex:1; padding:6px 0; gap:4px; overflow-x:auto}
  .side nav .grp{display:none}
  .side nav button{width:auto; white-space:nowrap; margin:0}
  .side .who{border-top:0; padding:8px; white-space:nowrap}
  .side .who .r{display:none}
  .side .who .out{margin-top:4px}
  .main{margin-left:0}
  .top{padding:0 14px}
  .view{padding:14px}
  .fgrid,.fgrid.c3{grid-template-columns:1fr}
}

/* ---------- 57mm Receipt Core Styles ---------- */
.receipt-paper {
  width: 57mm; max-width: 57mm; height: auto; min-height: 0;
  box-sizing: border-box; margin: 0 auto;
  font-family: 'Libre Franklin', sans-serif; font-size: 10px; line-height: 1.25; 
  padding: 2mm; background: #fff; color: #000;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Display shadow for preview only */
}
.receipt-paper * { font-family: 'Libre Franklin', sans-serif; }
.rt-center { text-align: center; }
.rt-right { text-align: right; }
.rt-bold { font-weight: 600; }
.rt-divider { border-top: 1px dashed #000; margin: 3mm 0; }
.rt-table { width: 100%; border-collapse: collapse; font-size: 9px; }
.rt-table td { padding: 0.5mm 0; vertical-align: top; }

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  @page{size:57mm auto; margin:0}
  html,body{width:57mm; margin:0; padding:0; background:#fff}
  #login,.side,.top,.view,#toasts,.modal-bg,.no-print{display:none!important}
  .main{margin:0!important}
  #printArea{display:block!important; position:absolute; left:0; top:0; width:57mm; margin:0; padding:0;}
  #printArea .receipt-paper{border:0; padding:1mm; max-width:57mm; width:57mm; height:auto!important; min-height:0!important; margin:0; box-shadow:none;}
}

.a4{font-family:'Archivo',system-ui,sans-serif; color:#111; background:#fff; font-size:12px}
.a4 .ph{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #111; padding-bottom:10px; margin-bottom:14px}
.a4 .ph .co{font-size:17px; font-weight:700; letter-spacing:-.01em}
.a4 .ph .ad{font-size:11px; color:#444; margin-top:2px; max-width:300px}
.a4 .ph .doc{text-align:right}

   MAGALLANES PHARMACY — POS, Inventory & Procurement

   CONFIGURATION -> STATE -> DATABASE/REPO -> AUTHENTICATION -> 
   PRODUCTS -> CART -> TAX/DISCOUNT ENGINE -> PRESCRIPTIONS/DOCTORS -> 
   CHECKOUT -> SALES -> RECEIPTS -> PDF -> PRINTING -> INVENTORY -> UI -> BOOT

/* ---------------- 2. DATABASE / REPOSITORY ---------------- */
const DB_NAME = 'magallanes_pharmacy';
const DB_VER = 2; // Incremented for doctors store
const SCHEMA = {
  meta:            { kp:'key', idx:[] },
  users:           { kp:'id', idx:['username'] },
  categories:      { kp:'id', idx:[] },
  suppliers:       { kp:'id', idx:[] },
  locations:       { kp:'id', idx:[] },
  products:        { kp:'id', idx:['barcode','sku','category_id','supplier_id','location_id','status'] },
  batches:         { kp:'id', idx:['product_id','expiry'] },
  sales:           { kp:'id', idx:['transaction_number','receipt_number','transaction_date','status'] },
  sale_items:      { kp:'id', idx:['sale_id','product_id'] },
  receipts:        { kp:'id', idx:['receipt_number','sale_id'] },
  movements:       { kp:'id', idx:['product_id','created_at','movement_type'] },
  purchase_orders: { kp:'id', idx:['po_number','supplier_id','status'] },
  po_items:        { kp:'id', idx:['purchase_order_id','product_id'] },
  audit:           { kp:'id', idx:['at'] },
  doctors:         { kp:'id', idx:['name', 'prcLicenseNo'] }
};
const TABLES = Object.keys(SCHEMA);

let _db = null;
function openDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e => {
      const db = e.target.result;
      for (const [name, def] of Object.entries(SCHEMA)){
        if (db.objectStoreNames.contains(name)) continue;
        const os = db.createObjectStore(name, { keyPath: def.kp });
        def.idx.forEach(f => os.createIndex(f, f, { unique:false }));
      }
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function tx(stores, mode){
  return _db.transaction(Array.isArray(stores) ? stores : [stores], mode);
}
function req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

const Repo = {
  async all(store){ return req(tx(store,'readonly').objectStore(store).getAll()); },
  async get(store, key){ return req(tx(store,'readonly').objectStore(store).get(key)); },
  async put(store, obj){ await req(tx(store,'readwrite').objectStore(store).put(obj)); return obj; },
  async putMany(store, arr){
    const t = tx(store,'readwrite'); const os = t.objectStore(store);
    arr.forEach(o => os.put(o));
    return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
  },
  async del(store, key){ await req(tx(store,'readwrite').objectStore(store).delete(key)); },
  async clear(store){ await req(tx(store,'readwrite').objectStore(store).clear()); },
  batch(stores, fn){
    const t = tx(stores, 'readwrite');
    const map = {}; stores.forEach(s => map[s] = t.objectStore(s));
    fn(map);
    return new Promise((res, rej) => { t.oncomplete = () => res(true); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('aborted')); });
  }
};

async function saveSettings(){ await Repo.put('meta', { key:'settings', value:S.settings }); }

/* ---------------- 3. UTILITIES & UI HELPERS ---------------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,10));
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d=0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const peso = n => '\u20B1' + (Math.round((num(n) + Number.EPSILON)*100)/100).toLocaleString('en-PH',{minimumFractionDigits:2, maximumFractionDigits:2});
const qtyFmt = n => num(n).toLocaleString('en-PH');
const pad = (n, w=4) => String(n).padStart(w,'0');

const D = {
  iso: d => { const x = d ? new Date(d) : new Date(); const o = x.getTimezoneOffset(); return new Date(x.getTime() - o*60000).toISOString().slice(0,10); },
  today: () => D.iso(new Date()),
  date: s => s ? new Date(s).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'2-digit'}) : '—',
  time: s => s ? new Date(s).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}) : '—',
  dt:   s => s ? new Date(s).toLocaleString('en-PH',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—',
  addDays: (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; },
  daysBetween: (a, b) => Math.round((new Date(b).setHours(0,0,0,0) - new Date(a).setHours(0,0,0,0)) / 86400000),
  startOfWeek: d => { const x = new Date(d); const dow = (x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; },
  startOfMonth: d => { const x = new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; },
  startOfYear: d => new Date(new Date(d).getFullYear(), 0, 1)
};

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
const hashPw = (pw, salt) => sha256(salt + '\u00A7' + pw);

function preserveFocus(render){
  const a = document.activeElement;
  const id = a && a.id ? a.id : null;
  const canSelect = a && typeof a.selectionStart === 'number';
  const start = canSelect ? a.selectionStart : null;
  const end = canSelect ? a.selectionEnd : null;
  render();
  if (!id) return;
  const b = document.getElementById(id);
  if (!b) return;
  try {
    b.focus({ preventScroll:true });
    if (start !== null && typeof b.setSelectionRange === 'function') b.setSelectionRange(start, end);
  } catch(e){}
}

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .2s'; setTimeout(() => t.remove(), 220); }, 2600);
}

function modal({ title, body, footer = '', width = '', onOpen, onClose }){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${width}" role="dialog" aria-modal="true">
    <div class="mh"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="mb">${body}</div>
    ${footer ? `<div class="mf">${footer}</div>` : ''}
  </div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  bg.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  $('#modalRoot').appendChild(bg);
  const first = bg.querySelector('input:not([type=hidden]),select,textarea,button.pri');
  if (first) setTimeout(() => first.focus(), 30);
  onOpen && onOpen(bg, close);
  return { root: bg, close };
}

function confirmDlg(title, message, { danger = false, okLabel = 'Confirm', needReason = false } = {}){
  return new Promise(resolve => {
    const m = modal({
      title, width:'narrow',
      body: `<p style="margin:0 0 4px">${message}</p>` + (needReason
        ? `<label class="f" style="margin-top:12px"><span>Reason (required)</span><input class="inp" id="cfReason" placeholder="State the reason"></label>` : ''),
      footer: `<button class="btn" data-close>Cancel</button><button class="btn ${danger?'danger':'pri'}" id="cfOk">${esc(okLabel)}</button>`,
      onClose: () => resolve(null)
    });
    m.root.querySelector('#cfOk').onclick = () => {
      if (needReason){
        const r = m.root.querySelector('#cfReason').value.trim();
        if (!r){ m.root.querySelector('#cfReason').classList.add('err'); return; }
        m.root.remove(); resolve(r);
      } else { m.root.remove(); resolve(true); }
    };
  });
}

function nextNumber(kind){
  S.settings.counters[kind] = (S.settings.counters[kind] || 0) + 1;
  const n = S.settings.counters[kind];
  const y = new Date().getFullYear();
  if (kind === 'txn') return `TXN-${D.today().replace(/-/g,'')}-${pad(n,4)}`;
  if (kind === 'receipt') return `AR-${pad(n,6)}`;
  if (kind === 'po') return `PO-${y}-${pad(n,4)}`;
  if (kind === 'adj') return `ADJ-${pad(n,5)}`;
  return String(n);
}

function stockStatus(p){
  const s = num(p.current_stock);
  if (s <= 0) return { key:'out', label:'Out of stock', cls:'bad' };
  if (s <= num(p.minimum_stock)) return { key:'critical', label:'Critical', cls:'bad' };
  if (s <= num(p.reorder_point)) return { key:'low', label:'Low stock', cls:'warn' };
  return { key:'ok', label:'In stock', cls:'ok' };
}
const batchesOf = pid => S.batches.filter(b => b.product_id === pid && num(b.qty) > 0).sort((a,b) => String(a.expiry||'9999').localeCompare(String(b.expiry||'9999')));
function expiryInfo(p){
  const bs = batchesOf(p.id);
  if (!bs.length) return null;
  const soonest = bs[0];
  if (!soonest.expiry) return null;
  const d = D.daysBetween(new Date(), soonest.expiry);
  let cls = 'ok', label = 'Good';
  if (d < 0){ cls = 'bad'; label = 'Expired'; }
  else if (d <= 30){ cls = 'bad'; label = `${d}d left`; }
  else if (d <= 60){ cls = 'warn'; label = `${d}d left`; }
  else if (d <= 90){ cls = 'warn'; label = `${d}d left`; }
  return { days:d, cls, label, expiry:soonest.expiry, batch:soonest };
}

const canNegative = () => ME && (ME.role === 'Administrator' || ME.role === 'Manager');

async function login(username, password){
  const u = S.users.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && x.status === 'active');
  if (!u) return null;
  const h = await hashPw(password, u.pass_salt);
  return h === u.pass_hash ? u : null;
}

}

      const upto = rest.findIndex(x => x.group);
      const anyBelow = (upto === -1 ? rest : rest.slice(0, upto)).some(x => can(x.perm));
      if (!anyBelow) return;
      const d = document.createElement('div'); d.className = 'grp'; d.textContent = item.group; n.appendChild(d); return;
    }
    if (!can(item.perm)) return;
    const b = document.createElement('button');
    b.dataset.page = item.key;
    b.innerHTML = `<span class="ic" aria-hidden="true">${item.ic}</span><span>${esc(item.label)}</span>`;
    b.onclick = () => go(item.key);
    n.appendChild(b);
  });
}

function go(key){
  const item = NAV.find(i => i.key === key);
  if (item && !can(item.perm)){ toast('Your role does not have access to that section.', 'bad'); return; }
  CURRENT = key;

/* ---------------- 6. TAX / DISCOUNT ENGINE ---------------- */
// Centralized calculation per instructions
function calculateTransactionTotals(lines, custType, isVatInclusive, vatRatePct) {
    let subtotal = 0, vatableSales = 0, vatAmount = 0, vatExemptSales = 0, seniorPwdDiscount = 0, finalAmount = 0;
    let requiresRx = false;
    const rate = vatRatePct / 100;
    const isSeniorPwd = custType === 'SENIOR' || custType === 'PWD';

    lines.forEach(l => {
        const lineGross = num(l.qty) * num(l.unit_price);
        subtotal += lineGross;
        if(l.rx_required) requiresRx = true;
        
        const p = prod(l.product_id);
        const isEligible = isSeniorPwd && p && (p.seniorPwdEligible !== false);

        if (isEligible) {
            // Step 1: VAT-Exempt Price
            const vatExempt = isVatInclusive ? lineGross / (1 + rate) : lineGross;
            // Step 2: 20% Discount
            const discount = vatExempt * 0.20;
            // Step 3: Final Amount
            const lineFinal = vatExempt - discount;

            vatExemptSales += vatExempt;
            seniorPwdDiscount += discount;
            finalAmount += lineFinal;
        } else {
            const vatable = isVatInclusive ? lineGross / (1 + rate) : lineGross;
            const vat = isVatInclusive ? lineGross - vatable : lineGross * rate;

            vatableSales += vatable;
            vatAmount += vat;
            finalAmount += lineGross;
        }
    });

    return { 
        subtotal: round2(subtotal), 
        vatableSales: round2(vatableSales), 
        vatAmount: round2(vatAmount), 
        vatExemptSales: round2(vatExemptSales), 
        seniorPwdDiscount: round2(seniorPwdDiscount), 
        total: round2(finalAmount),
        requiresRx
    };
}

function searchProducts(q, { includeArchived = false, limit = 60 } = {}){
  const t = q.trim().toLowerCase();
  let list = S.products.filter(p => includeArchived || p.status === 'active');
  if (!t) return list.slice(0, limit);
  const words = t.split(/\s+/);
  const scored = [];
  for (const p of list){
    const hay = `${p.name} ${p.generic_name} ${p.brand} ${p.sku} ${p.barcode}`.toLowerCase();
    if (!words.every(w => hay.includes(w))) continue;
    let score = 0;
    const n = p.name.toLowerCase(), g = (p.generic_name||'').toLowerCase();
    if (p.barcode === t || p.sku.toLowerCase() === t) score += 100;
    if (n.startsWith(t)) score += 50; else if (n.includes(t)) score += 20;
    if (g.startsWith(t)) score += 30; else if (g.includes(t)) score += 12;
    if (num(p.current_stock) > 0) score += 5;
    scored.push({ p, score });
  }
  return scored.sort((a,b) => b.score - a.score || a.p.name.localeCompare(b.p.name)).slice(0, limit).map(x => x.p);
}

/* ---------------- 9. CHECKOUT & SALE EXECUTION ---------------- */
function allocateFEFO(pid, qty){
  const today = D.today();
  const lots = batchesOf(pid);
  const alloc = []; let left = qty; let expiredBlocked = 0;
  for (const b of lots){
    if (b.expiry && b.expiry < today){ expiredBlocked += num(b.qty); continue; }
    if (left <= 0) break;
    const take = Math.min(left, num(b.qty));
    alloc.push({ batch_id:b.id, lot_no:b.lot_no, expiry:b.expiry, qty:take });
    left -= take;
  }
  return { alloc, shortfall:left, expiredBlocked };
}

async function executeSale({ cType, cId, payMode, tend, ref, docId, totals }) {
  for (const l of CART.lines){
      const p = prod(l.product_id);
      if (!p){ toast(`${l.name} is no longer in the catalogue.`, 'bad'); return; }
      if (l.qty > num(p.current_stock)){ toast(`Not enough stock of ${p.name}.`, 'bad'); return; }
      const a = allocateFEFO(p.id, l.qty);
      if (a.shortfall > 0 && a.expiredBlocked > 0){
          toast(`${p.name}: the remaining stock is expired and cannot be sold.`, 'bad'); return;
      }
      l._alloc = a.alloc;
  }

  const now = new Date().toISOString();
  const txnNo = nextNumber('txn'), orNo = nextNumber('receipt');
  const saleId = uid();
  
  const sale = {
      id: saleId, transaction_number: txnNo, receipt_number: orNo, transaction_date: now,
      subtotal: totals.subtotal, 
      vatableSales: totals.vatableSales,
      vatAmount: totals.vatAmount,
      vatExemptSales: totals.vatExemptSales,
      seniorPwdDiscount: totals.seniorPwdDiscount,
      total: totals.total,
      discount: totals.seniorPwdDiscount,
      discount_type: totals.seniorPwdDiscount > 0 ? `${cType} Discount 20%` : '',
      amount_paid: payMode === 'Cash' ? round2(tend) : totals.total,
      change: payMode === 'Cash' ? round2(tend - totals.total) : 0,
      payment_method: payMode, payment_ref: ref, 
      cashier_id: ME.id, cashier_name: ME.name,
      customer_type: cType, customer_id: cId, customer_name: cId || '',
      doctor_id: docId,
      status: 'completed', demo: false
  };

  const items = CART.lines.map(l => ({ 
      id:uid(), sale_id:saleId, product_id:l.product_id, name:l.name,
      generic_name:l.generic_name, barcode:l.barcode, quantity:l.qty, unit_price:l.unit_price,
      subtotal: round2(l.qty * l.unit_price),
      batch_alloc:l._alloc || [], rx_required: l.rx_required, transaction_date:now 
  }));
  
  const receipt = { id:uid(), receipt_number:orNo, sale_id:saleId, printed_at:now, print_count:0 };

  const movements = [], productPatches = [], batchPatches = [];
  CART.lines.forEach(l => {
      const p = prod(l.product_id);
      const prev = num(p.current_stock), next = prev - l.qty;
      productPatches.push({ ...p, current_stock:next, updated_at:now });
      movements.push({ id:uid(), product_id:p.id, movement_type:'Sale', quantity:-l.qty, previous_stock:prev, new_stock:next, reference_number:txnNo, reason:`Sold on ${orNo}`, user_id:ME.id, user_name:ME.name, created_at:now });
      (l._alloc || []).forEach(a => {
          const b = byId(S.batches, a.batch_id);
          if (b) batchPatches.push({ ...b, qty: num(b.qty) - a.qty });
      });
  });

  try {
    await Repo.batch(['sales','sale_items','receipts','products','batches','movements','meta'], st => {
      st.sales.put(sale);
      items.forEach(i => st.sale_items.put(i));
      st.receipts.put(receipt);
      productPatches.forEach(p => st.products.put(p));
      batchPatches.forEach(b => st.batches.put(b));
      movements.forEach(m => st.movements.put(m));
      st.meta.put({ key:'settings', value:S.settings });
    });
  } catch (err){
    console.error(err);
    S.settings.counters.txn--; S.settings.counters.receipt--;
    toast('The sale could not be saved. Nothing was changed — try again.', 'bad');
    return;
  }

  S.sales.push(sale); S.sale_items.push(...items); S.receipts.push(receipt);
  S.movements.push(...movements);
  productPatches.forEach(p => { const i = S.products.findIndex(x => x.id === p.id); if (i > -1) S.products[i] = p; });
  batchPatches.forEach(b => { const i = S.batches.findIndex(x => x.id === b.id); if (i > -1) S.batches[i] = b; });

  audit('Completed sale', `${orNo} \u00B7 ${peso(totals.total)}`);
  clearCart();
  LAST_SALE = saleId;
  showReceiptModal(saleId, { justSold:true });
}

        <div>${esc(ph.phone)} ${ph.mobile ? ' / ' + esc(ph.mobile) : ''}</div>
        ${ph.tin ? `<div>TIN ${esc(ph.tin)}</div>` : ''}
      </div>
      <div class="rt-divider"></div>
      <div class="rt-center rt-bold" style="font-size:11px;">SALES RECEIPT</div>
      ${s.status === 'voided' ? '<div class="rt-center rt-bold" style="color:#d00">*** VOIDED ***</div>' : ''}
      <div class="rt-divider"></div>
      <table class="rt-table">

        <tr><td>Txn:</td><td class="rt-right">${esc(s.transaction_number)}</td></tr>
        <tr><td>Date:</td><td class="rt-right">${D.dt(s.transaction_date)}</td></tr>
        <tr><td>Cashier:</td><td class="rt-right">${esc(s.cashier_name)}</td></tr>
        ${s.customer_type && s.customer_type !== 'REGULAR' ? `<tr><td>Customer:</td><td class="rt-right">${esc(s.customer_type)} -${esc(s.customer_id)}</td></tr>` : ''}
      </table>
      <div class="rt-divider"></div>
      <table class="rt-table">

            <tr><td colspan="2" class="rt-bold" style="padding-top:1mm">${esc(i.name)}</td></tr>
            <tr><td>${qtyFmt(i.quantity)} x${peso(i.unit_price)}</td><td class="rt-right">${peso(i.subtotal)}</td></tr>
        `).join('')}

      <div class="rt-divider"></div>

        <tr><td>Subtotal</td><td class="rt-right">${peso(s.subtotal)}</td></tr>
        <tr><td>VATable Sales</td><td class="rt-right">${peso(s.vatableSales || 0)}</td></tr>
        <tr><td>VAT Amount</td><td class="rt-right">${peso(s.vatAmount || 0)}</td></tr>

            <tr><td>VAT-Exempt Sales</td><td class="rt-right">${peso(s.vatExemptSales)}</td></tr>
            <tr><td>${s.customer_type} Discount</td><td class="rt-right">-${peso(s.seniorPwdDiscount)}</td></tr>
        ` : ''}
      </table>
      <div class="rt-divider"></div>
      <table class="rt-table" style="font-size:12px; font-weight:700">
        <tr><td>TOTAL</td><td class="rt-right">${peso(s.total)}</td></tr>
      </table>
      <table class="rt-table" style="margin-top:2mm;">
        <tr><td>${esc(s.payment_method)}</td><td class="rt-right">${peso(s.amount_paid)}</td></tr>
        ${s.payment_method === 'Cash' ? `<tr><td>Change</td><td class="rt-right">${peso(s.change)}</td></tr>` : `<tr><td>Ref</td><td class="rt-right">${esc(s.payment_ref)}</td></tr>`}
      </table>

          if(!doc) return '';
          return `<div class="rt-divider"></div>

      })() : ''}

function printDoc(html){
  $('#printArea').innerHTML = html;
  setTimeout(() => window.print(), 60);
}

async function generateReceiptPDF(saleId) {
    const s = byId(S.sales, saleId);
    if(!s) return;
    const html = receiptHTML(saleId);
    
    const container = document.createElement('div');
    container.style.position = 'absolute';
    container.style.top = '-9999px';
    container.style.left = '-9999px';
    container.style.width = '57mm';
    container.innerHTML = html;
    document.body.appendChild(container);
    
    await document.fonts.ready;
    
    const paper = container.querySelector('.receipt-paper');
    const rect = paper.getBoundingClientRect();
    
    const heightMm = Math.max((rect.height * 0.264583) + 2, 30);
    
    const opt = {
        margin: 0,
        filename: `Magallanes_Receipt_${s.receipt_number}.pdf`,
        image: { type: 'jpeg', quality: 1.0 },
        html2canvas: { scale: 3, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: [57, heightMm], orientation: 'portrait' }
    };
    
    html2pdf().set(opt).from(paper).save().then(() => {
        container.remove();
        toast('PDF downloaded.');
    });
}

function showReceiptModal(saleId, { justSold = false } = {}){
  const s = byId(S.sales, saleId); if (!s) return;
  const m = modal({
    title: justSold ? `Sale complete — ${s.receipt_number}` : `Receipt ${s.receipt_number}`,
    body: `
      <div style="background:#f0f0f0; padding:15px; display:flex; justify-content:center; max-height:50vh; overflow-y:auto">
        <div style="box-shadow:0 4px 10px rgba(0,0,0,0.1)">
          ${receiptHTML(saleId)}
        </div>
      </div>
    `,
    footer: `<button class="btn" data-close>Close</button>
      ${justSold ? '<button class="btn" id="rNext">Next customer</button>' : ''}
      <button class="btn" id="rPDF">Download PDF</button>
      <button class="btn pri" id="rPrint">Print <span class="keyhint" style="border-color:rgba(255,255,255,.4);color:#fff">Ctrl+P</span></button>`,
    onOpen: (root, close) => {
      root.querySelector('#rPrint').onclick = async () => {
        printDoc(receiptHTML(saleId));
        const r = S.receipts.find(x => x.sale_id === saleId);
        if (r){ r.print_count = num(r.print_count)+1; r.printed_at = new Date().toISOString(); await Repo.put('receipts', r); }
      };
      root.querySelector('#rPDF').onclick = () => { generateReceiptPDF(saleId); };
      const nx = root.querySelector('#rNext');
      if (nx) nx.onclick = () => { close(); if (CURRENT === 'pos') $('#posBarcode')?.focus(); };
    }
  });
  return m;
}

/* ---------------- 11. DASHBOARD & VIEWS (abridged preservation) ---------------- */
function salesBetween(from, to){
  const a = +new Date(from), b = +new Date(to);
  return S.sales.filter(s => s.status === 'completed' && +new Date(s.transaction_date) >= a && +new Date(s.transaction_date) <= b);
}
function todaySales(){
  const start = new Date(); start.setHours(0,0,0,0);
  const end = new Date(); end.setHours(23,59,59,999);
  return salesBetween(start, end);
}
const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
const inventoryValue = () => sum(S.products.filter(p => p.status === 'active'), p => num(p.current_stock) * num(p.cost_price));

VIEWS.dashboard = function(){
  const t = todaySales();
  const revenue = sum(t, s => s.total);
  const active = S.products.filter(p => p.status === 'active');
  const low = active.filter(p => ['low','critical'].includes(stockStatus(p).key));
  const recent = [...S.sales].sort((a,b) => b.transaction_date.localeCompare(a.transaction_date)).slice(0,8);

  $('#v-dashboard').innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); margin-bottom:16px">
      <div class="stat hi"><div class="k">Sales today</div><div class="v">${peso(revenue)}</div><div class="d">${t.length} transactions</div></div>
      <div class="stat"><div class="k">Inventory value</div><div class="v">${peso(inventoryValue())}</div><div class="d">${active.length} active lines</div></div>
      <div class="stat ${low.length?'warn':''}"><div class="k">Needs reordering</div><div class="v">${low.length}</div></div>
    </div>
    <div class="card">
      <div class="hd"><h3>Recent transactions</h3></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Receipt</th><th>Time</th><th>Customer</th><th>Total</th></tr></thead>
        <tbody>${recent.length ? recent.map(s => `<tr class="clickable" data-sale="${s.id}">
          <td class="mono">${esc(s.receipt_number)}</td>
          <td>${D.dt(s.transaction_date)}</td><td>${esc(s.customer_type||'REGULAR')}</td>
          <td class="num">${peso(s.total)}</td></tr>`).join('')
          : `<tr><td colspan="4"><div class="empty">No sales recorded yet.</div></td></tr>`}</tbody>
      </table></div>
    </div>`;
  $$('#v-dashboard [data-sale]').forEach(r => r.onclick = () => showReceiptModal(r.dataset.sale));
};

/* ---------------- 12. ARCHITECTURE BOOT SEQUENCE ---------------- */
function tickClock(){
  const now = new Date();
  const el = $('#clock');
  if (el) el.textContent = now.toLocaleDateString('en-PH',{weekday:'short', day:'2-digit', month:'short'}) + ' \u00B7 ' + now.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function boot() {
    try {
        await initializeStorage();
        await initializeSettings();
        await initializeUsers();
        await initializeDemoData();
        await loadApplicationData();
        initializeTheme();
        initializeUI();
        restoreSession();
    } catch (error) {
        console.error(error);
        const lg = $('#lgErr');
        if (lg) lg.textContent = 'System boot failed: ' + error.message;
    }
}

async function initializeStorage() {
    _db = await openDB();
}

async function initializeSettings() {
    S.settings = (await Repo.get('meta','settings'))?.value || null;
    if (!S.settings) { S.settings = DEFAULT_SETTINGS(); await saveSettings(); }
}

async function initializeUsers() {
    S.users = await Repo.all('users');
    if (!S.users.length) { await seedUsers(); S.users = await Repo.all('users'); }
}

async function initializeDemoData() {
    S.products = await Repo.all('products');
    if (!S.settings.seeded && !S.products.length) {
        const lg = $('#lgErr'); if(lg) lg.textContent = 'Preparing sample data\u2026';
        await seedDemoData();
        if(lg) lg.textContent = '';
    }
}

async function loadApplicationData() {
    for (const t of TABLES) { 
        if (t !== 'users' && t !== 'meta') S[t] = await Repo.all(t); 
    }
}

function initializeTheme() {
    $('#themeBtn').onclick = () => {
        const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('mp_theme', next); } catch {}
    };
    try { const th = localStorage.getItem('mp_theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch {}
}

function initializeUI() {
    $('.side .brand .nm').textContent = S.settings.pharmacy.name;
    $('.side .brand .tag').textContent = S.settings.pharmacy.tagline;
    const lgHint = $('#lgHint');
    if (lgHint) lgHint.innerHTML = 'Demo accounts — <code>admin</code> / <code>admin123</code>, <code>cashier</code> / <code>cashier123</code>.';
    
    const doLogin = async () => {
        const u = await login($('#lgUser').value, $('#lgPass').value);
        if (!u){ $('#lgErr').textContent = 'Invalid credentials.'; return; }
        $('#lgErr').textContent = '';
        startSession(u);
    };
    const lgGo = $('#lgGo'); if(lgGo) lgGo.onclick = doLogin;
    ['#lgUser','#lgPass'].forEach(s => { const e=$(s); if(e) e.onkeydown = ev => { if (ev.key === 'Enter') doLogin(); }; });$('#logoutBtn').onclick = logout;
    
    // Global Keybinds
    document.addEventListener('keydown', e => {
      if (!ME) return;
      const modalOpen = !!$('.modal-bg');
      if (e.key === 'F1'){ e.preventDefault(); if (can('pos')){ go('pos'); setTimeout(() => $('#posSearch')?.focus(), 40); } }
      else if (e.key === 'F2'){ e.preventDefault(); if (can('pos')){ go('pos'); setTimeout(() => $('#posBarcode')?.focus(), 40); } }
      else if (e.key === 'F4'){ e.preventDefault(); if (CURRENT === 'pos' && !modalOpen) showCheckoutModal(); }
      else if (e.key === 'Escape' && !modalOpen && CURRENT === 'pos') clearCart();
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p'){
        if (CURRENT === 'pos' && LAST_SALE && !modalOpen){ e.preventDefault(); showReceiptModal(LAST_SALE); }
      }
    });

    tickClock(); setInterval(tickClock, 1000);
}

function restoreSession() {
    const sid = sessionStorage.getItem('mp_session');
    const restored = sid && S.users.find(u => u.id === sid && u.status === 'active');
    if (restored) startSession(restored); else { const lu=$('#lgUser'); if(lu)lu.focus(); }
}

boot();
</script>
