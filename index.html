<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Magallanes Pharmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

<main class="login-card">
  <header class="login-head">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M9.2 2h5.6v4.4h4.4v5.6h-4.4V22H9.2V12H4.8V6.4h4.4z"/></svg>
    </div>
    <h1>Magallanes Pharmacy</h1>
    <p>Your Health, Our Priority.</p>
  </header>

  <form id="loginForm" class="login-body" autocomplete="on">
    <label class="field">
      <span>Username</span>
      <input id="username" name="username" autocomplete="username" autofocus required>
    </label>
    <label class="field">
      <span>Password</span>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="error" class="error" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>

  <footer class="login-hint">
    <p><strong>Demo accounts</strong></p>
    <p><code>admin</code> / <code>admin123</code> · <code>cashier</code> / <code>cashier123</code></p>
    <p><code>inventory</code> / <code>inventory123</code> · <code>manager</code> / <code>manager123</code></p>
  </footer>
</main>

<script type="module">
  import { initDB } from './js/db.js';
  import { seedIfEmpty } from './js/seed.js';
  import { login } from './js/auth.js';

  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('error');

  (async () => {
    try {
      await initDB();
      await seedIfEmpty();
    } catch (e) {
      console.error(e);
      errEl.textContent = 'Storage was blocked. Try a normal (non-private) window.';
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    const user = await login(
      document.getElementById('username').value,
      document.getElementById('password').value
    );
    if (!user) { errEl.textContent = 'Wrong username or password.'; return; }
    sessionStorage.setItem('mp_user', JSON.stringify(user));
    location.href = 'pos.html';
  });
</script>
</body>
</html>
